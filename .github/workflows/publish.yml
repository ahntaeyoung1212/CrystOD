# Build and upload a release to PyPI when a version tag (v*) is pushed.
#
# No API token is stored anywhere: the upload uses PyPI's Trusted Publishing,
# a short-lived OpenID Connect token that GitHub mints for this workflow and
# PyPI exchanges for upload rights (spec risk R-9). One-time setup:
#
#   1. On pypi.org: project CrystOD -> Manage -> Publishing -> "Add a new
#      publisher" (GitHub) with owner `ahntaeyoung1212`, repository
#      `CrystOD`, workflow name `publish.yml`, environment name `release`.
#   2. On GitHub: Settings -> Environments -> New environment `release`, with
#      "Required reviewers" enabled (the maintainer). The publish job below
#      then waits for a manual approval on the run page before anything
#      reaches PyPI, so a stray or premature tag cannot publish by itself.
#      Optionally restrict the environment's deployment branches/tags to `v*`.
#
# Release recipe:
#
#   1. Bump the version in pyproject.toml (`version`), crystod/__init__.py
#      (`__version__`) and CITATION.cff (`version`, `date-released`), and add
#      the release section to doc/changelog.md.
#   2. Commit, tag and push:
#        git commit -am "CrystOD v0.4.0"
#        git tag v0.4.0
#        git push origin main --tags
#   3. Approve the `release` deployment on the Actions run page. By then the
#      build job has refused a tag that does not match the three version
#      fields, built the sdist and wheel, and run `twine check` on them.
#
# PyPI never accepts a file name it has already seen, so a botched release is
# fixed by a new patch version, not by re-running this workflow.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the version fields
        run: |
          python - "${GITHUB_REF_NAME}" <<'PY'
          import re
          import sys
          import tomllib

          tag = sys.argv[1]
          versions = {
              "pyproject.toml": tomllib.load(open("pyproject.toml", "rb"))["project"]["version"],
              "crystod/__init__.py": re.search(
                  r'^__version__ = "([^"]+)"', open("crystod/__init__.py").read(), re.M
              ).group(1),
              "CITATION.cff": re.search(
                  r'^version: "([^"]+)"', open("CITATION.cff").read(), re.M
              ).group(1),
          }
          bad = {path: v for path, v in versions.items() if f"v{v}" != tag}
          if bad:
              sys.exit(f"tag {tag} does not match: {bad}")
          print(f"tag {tag} matches pyproject.toml, crystod/__init__.py and CITATION.cff")
          PY
      - name: Build and check the distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://pypi.org/project/CrystOD/
    permissions:
      id-token: write   # mint the OIDC token that PyPI exchanges for an upload
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
