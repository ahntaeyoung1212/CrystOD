[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CrystOD"
version = "0.3.6"
authors = [
  {name = "Yasuhide Mochizuki"},
  {email = "mochizuki@rs.tus.ac.jp"},
]
description = "Python-based command line tools calculating irreducible representations (irreps) of Symmetry-Adapted Linear Combination (SALC) for Crystal Orbital Diagram (CrystOD), and phonon irreps."
readme = "README.md"
license = {text = "MIT License"}
requires-python = ">=3.9"
dependencies = [
  "phonopy",
  "spglib",
  "spgrep",
  "ase",
  "numpy",
  "pandas",
  "openpyxl",
  "sympy",
  "scipy",
  "seekpath",
  "pymatgen",
  "pyscf",
]

[project.optional-dependencies]
doc = [
  "sphinx",
  "myst-parser",
  "sphinx-book-theme",
  "sphinx-copybutton",
]

[project.scripts]
crystod = "crystod.cli:main"
crystod-bz = "crystod.cli.bz:main"
crystod-md = "crystod.cli.md:main"
crystod-mag = "crystod.cli.mag:main"
crystod-mol = "crystod.cli.mol:main"
crystod-phonon = "crystod.cli.phonon:main"
crystod-group = "crystod.cli.group:main"

[tool.setuptools]
packages = ["crystod", "crystod.cli"]

[tool.setuptools.package-data]
crystod = ["CIR_data.txt.gz", "vesta_element_rgb.json"]

[project.urls]
Homepage = "https://mochizuki-tus.github.io/"
