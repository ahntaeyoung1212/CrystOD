[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CrystOD"
version = "0.3.6"
authors = [
  {name = "Yasuhide Mochizuki"},
  {name = "Hiroki Koiso"},
]
maintainers = [
  {name = "Yasuhide Mochizuki", email = "mochizuki@rs.tus.ac.jp"},
]
description = "Symmetry analysis toolkit for crystal orbital diagrams (SALC), space-group irreps, phonon irreps and modulations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = [
  "crystallography",
  "space group",
  "irreducible representation",
  "phonon",
  "SALC",
  "crystal orbital",
  "symmetry",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
  "Operating System :: OS Independent",
]
dependencies = [
  "phonopy",
  "spglib",
  "spgrep",
  "ase",
  "numpy",
  "scipy",
  "sympy",
  "pandas",
  "matplotlib",
  "seekpath",
  "pymatgen",
  "pyscf",
]

[project.optional-dependencies]
doc = [
  "sphinx",
  "myst-parser",
  "sphinx-book-theme",
  "sphinx-copybutton",
]

[project.scripts]
crystod = "crystod.cli:main"
crystod-bz = "crystod.cli.bz:main"
crystod-md = "crystod.cli.md:main"
crystod-mag = "crystod.cli.mag:main"
crystod-mol = "crystod.cli.mol:main"
crystod-phonon = "crystod.cli.phonon:main"
crystod-group = "crystod.cli.group:main"

[tool.setuptools]
packages = ["crystod", "crystod.cli"]

[tool.setuptools.package-data]
crystod = ["CIR_data.txt.gz", "vesta_element_rgb.json"]

[project.urls]
Homepage = "https://mochizuki-tus.github.io/CrystOD/"
Documentation = "https://mochizuki-tus.github.io/CrystOD/"
Repository = "https://github.com/ahntaeyoung1212/CrystOD"
Issues = "https://github.com/ahntaeyoung1212/CrystOD/issues"
